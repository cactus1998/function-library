<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap"
    />
    <title>Function Library</title>
    <script>
      // 正式站在深層網址重新整理時，GitHub Pages 會回傳根目錄的 404.html，
      // 它把原網址存進 sessionStorage 後導回這裡；router 啟動前先還原網址。
      ;(function () {
        try {
          var target = sessionStorage.getItem('spa-redirect')
          sessionStorage.removeItem('spa-redirect')
          if (target && target.indexOf(location.pathname) === 0 && target !== location.pathname) {
            history.replaceState(null, '', target)
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
